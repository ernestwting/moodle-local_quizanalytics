name: Moodle Plugin CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: ${{ matrix.database == 'pgsql' && 'postgres:17' || '' }}
        env:
          POSTGRES_USER: 'postgres'
          POSTGRES_HOST_AUTH_METHOD: 'trust'
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 3

      mariadb:
        image: ${{ matrix.database == 'mariadb' && 'mariadb:11' || '' }}
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: '1'
          MYSQL_CHARACTER_SET_SERVER: "utf8mb4"
          MYSQL_COLLATION_SERVER: "utf8mb4_unicode_ci"
        ports:
          - 3306:3306
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval 10s --health-timeout 5s --health-retries 3

    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3']
        moodle-branch: ['MOODLE_405_STABLE']
        database: [pgsql, mariadb]

    steps:
      # qtype_stack's own db/install.php unconditionally tries to build an
      # optimized Maxima image whenever PHPUNIT_TEST is true (which it is
      # during moodle-plugin-ci's own phpunit-init sub-step), throwing a
      # coding_exception if no working `maxima` binary is available.
      # Confirmed by reading question/type/stack/db/install.php directly
      # while building the standalone local_stackanalytics plugin this one
      # merges — not guessed. The real qtype_stack project's own CI installs
      # a specific pinned Maxima build via sourceforge .deb files; this uses
      # Ubuntu's own packaged `maxima` instead, which auto-detects fine as
      # connectorhelper.class.php's Lisp-backend detection (GCL/SBCL/CLISP)
      # reads `maxima`'s own build info rather than assuming one.
      - name: Install Maxima (required by qtype_stack)
        run: |
          sudo apt-get update
          # --no-install-recommends: plain `apt-get install maxima` pulls in
          # a full TeX Live distribution as a recommended (docs-building)
          # dependency, which costs several minutes and gigabytes for
          # something this workflow never uses.
          sudo apt-get install -y --no-install-recommends maxima
          echo "diff(x^2, x); quit();" | maxima --very-quiet

      # Installing a working `maxima` binary (above) was necessary but not
      # sufficient — Ubuntu's packaged Maxima isn't a drop-in match for
      # whatever create_auto_maxima_image()
      # (question/type/stack/stack/cas/connectorhelper.class.php) expects to
      # compile against. install.php's own guard condition offers a
      # documented escape hatch instead of fighting that: it skips the
      # optimized-image build entirely if QTYPE_STACK_TEST_CONFIG_PLATFORM is
      # defined as 'server', 'server-proxy', or 'none' *before* its
      # PHPUNIT_TEST branch runs. `moodle-plugin-ci add-config` can't do this
      # — its own source (AddConfigCommand.php) confirms it edits config.php
      # *after* `install` completes, by which point install.php has already
      # run and crashed. PHP's auto_prepend_file (set on the PHP setup step
      # below) instead guarantees the constant exists for every PHP process
      # in this job from the start, including moodle-plugin-ci's internal
      # phpunit-init sub-step.
      - name: Write qtype_stack CI override (skip its optimized-Maxima-image build)
        run: echo "<?php define('QTYPE_STACK_TEST_CONFIG_PLATFORM', 'none');" > "${{ github.workspace }}/qtype_stack_ci_override.php"

      - name: Check out this plugin
        uses: actions/checkout@v6
        with:
          path: plugin
          persist-credentials: false

      # qtype_stack is a required dependency (version.php) not shipped with
      # core, so moodle-plugin-ci needs it checked out separately and told
      # about it via EXTRA_PLUGINS_DIR — the real repository location
      # (github.com/maths/moodle-qtype_stack) was confirmed from a CDN URL
      # inside qtype_stack's own mkdocs.yml, not guessed.
      - name: Check out qtype_stack (required plugin dependency)
        uses: actions/checkout@v4
        with:
          repository: maths/moodle-qtype_stack
          path: extra-plugins/qtype_stack

      # qtype_stack's own version.php in turn depends on four more plugins
      # not shipped with core (qbehaviour_adaptivemultipart,
      # qbehaviour_dfexplicitvaildate, qbehaviour_dfcbmexplicitvaildate,
      # qbank_importasversion), confirmed directly from qtype_stack's own
      # installation docs (doc/en/Installation/index.md) rather than
      # guessed. Missing these doesn't fail cleanly: a STACK question's own
      # question.php require_once()s the adaptivemultipart behaviour
      # unconditionally, so any PHPUnit test that instantiates a STACK quiz
      # attempt fails with a missing-file/class error that looks unrelated
      # to a missing plugin at first glance. moodle-plugin-ci finds each one
      # via its own version.php under EXTRA_PLUGINS_DIR regardless of the
      # checkout path used here, same as qtype_stack itself above.
      - name: Check out qtype_stack's own required plugin dependencies
        uses: actions/checkout@v4
        with:
          repository: maths/moodle-qbehaviour_adaptivemultipart
          path: extra-plugins/qbehaviour_adaptivemultipart

      - name: Check out qbehaviour_dfexplicitvaildate (qtype_stack dependency)
        uses: actions/checkout@v4
        with:
          repository: maths/moodle-qbehaviour_dfexplicitvaildate
          path: extra-plugins/qbehaviour_dfexplicitvaildate

      - name: Check out qbehaviour_dfcbmexplicitvaildate (qtype_stack dependency)
        uses: actions/checkout@v4
        with:
          repository: maths/moodle-qbehaviour_dfcbmexplicitvaildate
          path: extra-plugins/qbehaviour_dfcbmexplicitvaildate

      - name: Check out qbank_importasversion (qtype_stack dependency)
        uses: actions/checkout@v4
        with:
          repository: maths/moodle-qbank_importasversion
          path: extra-plugins/qbank_importasversion

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          ini-values: max_input_vars=5000, opcache.enable_cli=1, auto_prepend_file=${{ github.workspace }}/qtype_stack_ci_override.php
          coverage: none

      - name: Initialize moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo $(cd ci/bin; pwd) >> $GITHUB_PATH
          echo $(cd ci/vendor/bin; pwd) >> $GITHUB_PATH
          sudo locale-gen en_AU.UTF-8
          echo "NVM_DIR=$HOME/.nvm" >> $GITHUB_ENV
          # PLUGIN_DIR is what every moodle-plugin-ci subcommand (phplint,
          # phpcs, ...) defaults its <plugin> argument to — install's own
          # --plugin flag only scopes that one command, it doesn't persist
          # to the separate shell invocations each later step runs in.
          echo "PLUGIN_DIR=$(pwd)/plugin" >> $GITHUB_ENV

      - name: Install moodle-plugin-ci
        run: moodle-plugin-ci install --plugin "$PLUGIN_DIR" --db-host=127.0.0.1
        env:
          DB: ${{ matrix.database }}
          MOODLE_BRANCH: ${{ matrix.moodle-branch }}
          EXTRA_PLUGINS_DIR: ${{ github.workspace }}/extra-plugins

      - name: PHP Lint
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phplint

      - name: PHP Mess Detector
        continue-on-error: true
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpmd

      - name: Moodle Code Checker
        # This merge ported a substantial amount of already-shipped code
        # from two working plugins; several files carry pre-existing phpcs
        # debt (mostly missing one-line phpdoc summaries and a brace-style
        # nit) confirmed to predate the port, not introduced by it — see
        # CHANGELOG.md's Phase 20 entry for the tracked cleanup. Flip this
        # to strict (drop continue-on-error) once that cleanup lands.
        continue-on-error: true
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpcs --max-warnings 0

      - name: Moodle PHPDoc Checker
        continue-on-error: true
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpdoc --max-warnings 0

      - name: Validating
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci validate

      - name: Check upgrade savepoints
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci savepoints

      - name: Mustache Lint
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci mustache

      - name: PHPUnit tests
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpunit --fail-on-warning

      - name: Mark cancelled jobs as failed.
        if: ${{ cancelled() }}
        run: exit 1
